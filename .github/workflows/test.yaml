# Installs and tests every formula on each push and pull request.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Put Homebrew on the PATH
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          fi
      - name: Tap this checkout
        run: |
          brew tap-new --no-git yama6a/local
          brew trust yama6a/local
          cp Formula/*.rb "$(brew --repository yama6a/local)/Formula/"
      - name: Audit, install and test stbox
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          brew audit --strict --online yama6a/local/stbox
          brew install yama6a/local/stbox
          brew test yama6a/local/stbox
          stbox --version
